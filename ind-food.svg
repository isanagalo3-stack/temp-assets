<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-food" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efece5"/>
      <stop offset="100%" stop-color="#e2ddcd"/>
    </linearGradient>
    <pattern id="grid-food" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f29" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <linearGradient id="metal-food" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a3142"/>
      <stop offset="50%" stop-color="#1a1f29"/>
      <stop offset="100%" stop-color="#0e1219"/>
    </linearGradient>
    <linearGradient id="metal2-food" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a4253"/>
      <stop offset="50%" stop-color="#252b39"/>
      <stop offset="100%" stop-color="#161a25"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg-food)"/>
  <rect width="800" height="800" fill="url(#grid-food)"/>
  <!-- Top-right ornament -->
  <circle cx="700" cy="120" r="80" fill="none" stroke="#1a1f29" stroke-width="1" opacity="0.07"/>
  <circle cx="700" cy="120" r="50" fill="none" stroke="#1a1f29" stroke-width="1" opacity="0.10"/>
  <circle cx="700" cy="120" r="20" fill="#ff5a1f" opacity="0.18"/>
  <!-- Top-left industry icon -->
  <g transform="translate(80,90)" opacity="0.5">
    
    <line x1="0" y1="42" x2="0" y2="0" stroke="#1a1f29" stroke-width="1.5"/>
    <path d="M 0 8 Q -8 4 -8 -2 Q 0 0 0 6" fill="#1a1f29"/>
    <path d="M 0 8 Q 8 4 8 -2 Q 0 0 0 6" fill="#1a1f29"/>
    <path d="M 0 20 Q -8 16 -8 10 Q 0 12 0 18" fill="#1a1f29"/>
    <path d="M 0 20 Q 8 16 8 10 Q 0 12 0 18" fill="#1a1f29"/>
    <path d="M 0 32 Q -8 28 -8 22 Q 0 24 0 30" fill="#1a1f29"/>
    <path d="M 0 32 Q 8 28 8 22 Q 0 24 0 30" fill="#1a1f29"/>
  </g>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="650" rx="240" ry="14" fill="#1a1f29" opacity="0.10"/>

  <!-- Bottom row of 3 cans -->
  <g transform="translate(400,640)">
    <!-- Can 1 (left) -->
    <g transform="translate(-150,0)">
      <ellipse cx="0" cy="0" rx="50" ry="13" fill="#0d1119"/>
      <rect x="-50" y="-180" width="100" height="180" fill="url(#metal-food)"/>
      <ellipse cx="0" cy="-180" rx="50" ry="13" fill="#3a4253"/>
      <rect x="-50" y="-130" width="100" height="40" fill="#ff5a1f"/>
      <rect x="-50" y="-130" width="100" height="3" fill="#fff" opacity="0.25"/>
      <rect x="-50" y="-93" width="100" height="3" fill="#fff" opacity="0.25"/>
      <text x="0" y="-105" fill="#fff" font-family="Arial" font-size="10" font-weight="700" text-anchor="middle" opacity="0.85">PREMIUM</text>
    </g>
    <!-- Can 2 (center) -->
    <g transform="translate(0,0)">
      <ellipse cx="0" cy="0" rx="50" ry="13" fill="#0d1119"/>
      <rect x="-50" y="-180" width="100" height="180" fill="url(#metal2-food)"/>
      <ellipse cx="0" cy="-180" rx="50" ry="13" fill="#4a5263"/>
      <rect x="-50" y="-130" width="100" height="40" fill="#f7f5f0"/>
      <line x1="-40" y1="-115" x2="40" y2="-115" stroke="#1a1f29" stroke-width="1.5"/>
      <line x1="-30" y1="-105" x2="30" y2="-105" stroke="#ff5a1f" stroke-width="2"/>
      <line x1="-40" y1="-95" x2="40" y2="-95" stroke="#1a1f29" stroke-width="1.5"/>
    </g>
    <!-- Can 3 (right) -->
    <g transform="translate(150,0)">
      <ellipse cx="0" cy="0" rx="50" ry="13" fill="#0d1119"/>
      <rect x="-50" y="-180" width="100" height="180" fill="url(#metal-food)"/>
      <ellipse cx="0" cy="-180" rx="50" ry="13" fill="#3a4253"/>
      <rect x="-50" y="-130" width="100" height="40" fill="#ff5a1f"/>
      <rect x="-50" y="-130" width="100" height="3" fill="#fff" opacity="0.25"/>
      <rect x="-50" y="-93" width="100" height="3" fill="#fff" opacity="0.25"/>
      <text x="0" y="-105" fill="#fff" font-family="Arial" font-size="10" font-weight="700" text-anchor="middle" opacity="0.85">PREMIUM</text>
    </g>
  </g>

  <!-- Top row of 2 cans -->
  <g transform="translate(400,460)">
    <g transform="translate(-75,0)">
      <ellipse cx="0" cy="0" rx="48" ry="12" fill="#0d1119"/>
      <rect x="-48" y="-170" width="96" height="170" fill="url(#metal2-food)"/>
      <ellipse cx="0" cy="-170" rx="48" ry="12" fill="#4a5263"/>
      <rect x="-48" y="-122" width="96" height="38" fill="#f7f5f0"/>
      <circle cx="0" cy="-103" r="10" fill="#ff5a1f"/>
    </g>
    <g transform="translate(75,0)">
      <ellipse cx="0" cy="0" rx="48" ry="12" fill="#0d1119"/>
      <rect x="-48" y="-170" width="96" height="170" fill="url(#metal-food)"/>
      <ellipse cx="0" cy="-170" rx="48" ry="12" fill="#3a4253"/>
      <rect x="-48" y="-122" width="96" height="38" fill="#ff5a1f"/>
      <text x="0" y="-97" fill="#fff" font-family="Arial" font-size="9" font-weight="700" text-anchor="middle" opacity="0.85">PREMIUM</text>
    </g>
  </g>

  <!-- Floating can (being placed) - top center -->
  <g transform="translate(400,260)">
    <ellipse cx="0" cy="6" rx="40" ry="6" fill="#1a1f29" opacity="0.18"/>
    <ellipse cx="0" cy="0" rx="42" ry="11" fill="#0d1119"/>
    <rect x="-42" y="-150" width="84" height="150" fill="url(#metal-food)"/>
    <ellipse cx="0" cy="-150" rx="42" ry="11" fill="#3a4253"/>
    <rect x="-42" y="-105" width="84" height="33" fill="#ff5a1f"/>
    <text x="0" y="-82" fill="#fff" font-family="Arial" font-size="9" font-weight="700" text-anchor="middle" opacity="0.9">PREMIUM</text>
    <!-- Gripper line -->
    <line x1="0" y1="-150" x2="0" y2="-200" stroke="#1a1f29" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.5"/>
    <rect x="-18" y="-205" width="36" height="6" rx="1" fill="#1a1f29" opacity="0.6"/>
  </g>

</svg>
