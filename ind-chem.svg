<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-chem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efece5"/>
      <stop offset="100%" stop-color="#e2ddcd"/>
    </linearGradient>
    <pattern id="grid-chem" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f29" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <linearGradient id="metal-chem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a3142"/>
      <stop offset="50%" stop-color="#1a1f29"/>
      <stop offset="100%" stop-color="#0e1219"/>
    </linearGradient>
    <linearGradient id="metal2-chem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a4253"/>
      <stop offset="50%" stop-color="#252b39"/>
      <stop offset="100%" stop-color="#161a25"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg-chem)"/>
  <rect width="800" height="800" fill="url(#grid-chem)"/>
  <!-- Top-right ornament -->
  <circle cx="700" cy="120" r="80" fill="none" stroke="#1a1f29" stroke-width="1" opacity="0.07"/>
  <circle cx="700" cy="120" r="50" fill="none" stroke="#1a1f29" stroke-width="1" opacity="0.10"/>
  <circle cx="700" cy="120" r="20" fill="#ff5a1f" opacity="0.18"/>
  <!-- Top-left industry icon -->
  <g transform="translate(80,90)" opacity="0.5">
    
    <path d="M 0 -15 L 13 8 L -13 8 Z" fill="none" stroke="#1a1f29" stroke-width="1.8"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#1a1f29" stroke-width="1.8"/>
    <circle cx="0" cy="6" r="1.5" fill="#1a1f29"/>
  </g>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="650" rx="240" ry="14" fill="#1a1f29" opacity="0.10"/>

  <!-- Cluster of cylindrical drums -->
  <!-- Bottom row: 3 large drums -->
  <g transform="translate(400,640)">
    <g transform="translate(-160,0)">
      <ellipse cx="0" cy="0" rx="60" ry="14" fill="#0d1119"/>
      <rect x="-60" y="-180" width="120" height="180" fill="#f7f5f0"/>
      <ellipse cx="0" cy="-180" rx="60" ry="14" fill="#cfc9b6"/>
      <!-- top rim -->
      <ellipse cx="0" cy="-180" rx="50" ry="11" fill="#1a1f29"/>
      <ellipse cx="0" cy="-181" rx="40" ry="9" fill="#3a4253"/>
      <!-- handle -->
      <path d="M -60 -150 Q -75 -130 -60 -110" fill="none" stroke="#1a1f29" stroke-width="3"/>
      <path d="M 60 -150 Q 75 -130 60 -110" fill="none" stroke="#1a1f29" stroke-width="3"/>
      <!-- hazard label -->
      <rect x="-40" y="-110" width="80" height="55" fill="#ff5a1f"/>
      <path d="M 0 -98 L 12 -75 L -12 -75 Z" fill="none" stroke="#fff" stroke-width="2.5"/>
      <line x1="0" y1="-92" x2="0" y2="-85" stroke="#fff" stroke-width="2.5"/>
      <circle cx="0" cy="-79" r="1.5" fill="#fff"/>
    </g>
    <g transform="translate(0,0)">
      <ellipse cx="0" cy="0" rx="65" ry="15" fill="#0d1119"/>
      <rect x="-65" y="-200" width="130" height="200" fill="#1a1f29"/>
      <ellipse cx="0" cy="-200" rx="65" ry="15" fill="#0e1219"/>
      <ellipse cx="0" cy="-200" rx="55" ry="12" fill="#3a4253"/>
      <ellipse cx="0" cy="-201" rx="45" ry="10" fill="#252b39"/>
      <!-- handle -->
      <path d="M -65 -160 Q -82 -140 -65 -120" fill="none" stroke="#0e1219" stroke-width="3"/>
      <path d="M 65 -160 Q 82 -140 65 -120" fill="none" stroke="#0e1219" stroke-width="3"/>
      <!-- bands -->
      <rect x="-65" y="-130" width="130" height="6" fill="#ff5a1f"/>
      <rect x="-65" y="-90" width="130" height="6" fill="#ff5a1f"/>
      <!-- label -->
      <rect x="-45" y="-118" width="90" height="22" fill="#f7f5f0"/>
      <text x="0" y="-103" font-family="Arial" font-size="13" font-weight="800" fill="#1a1f29" text-anchor="middle">CHEM-25</text>
    </g>
    <g transform="translate(160,0)">
      <ellipse cx="0" cy="0" rx="60" ry="14" fill="#0d1119"/>
      <rect x="-60" y="-180" width="120" height="180" fill="#f7f5f0"/>
      <ellipse cx="0" cy="-180" rx="60" ry="14" fill="#cfc9b6"/>
      <ellipse cx="0" cy="-180" rx="50" ry="11" fill="#1a1f29"/>
      <ellipse cx="0" cy="-181" rx="40" ry="9" fill="#3a4253"/>
      <path d="M -60 -150 Q -75 -130 -60 -110" fill="none" stroke="#1a1f29" stroke-width="3"/>
      <path d="M 60 -150 Q 75 -130 60 -110" fill="none" stroke="#1a1f29" stroke-width="3"/>
      <rect x="-40" y="-110" width="80" height="55" fill="#1a1f29"/>
      <path d="M 0 -98 L 12 -75 L -12 -75 Z" fill="none" stroke="#ff5a1f" stroke-width="2.5"/>
      <line x1="0" y1="-92" x2="0" y2="-85" stroke="#ff5a1f" stroke-width="2.5"/>
      <circle cx="0" cy="-79" r="1.5" fill="#ff5a1f"/>
    </g>
  </g>

  <!-- Top row: 2 drums -->
  <g transform="translate(400,420)">
    <g transform="translate(-80,0)">
      <ellipse cx="0" cy="0" rx="55" ry="13" fill="#0d1119"/>
      <rect x="-55" y="-170" width="110" height="170" fill="#1a1f29"/>
      <ellipse cx="0" cy="-170" rx="55" ry="13" fill="#0e1219"/>
      <ellipse cx="0" cy="-170" rx="45" ry="10" fill="#3a4253"/>
      <path d="M -55 -135 Q -70 -118 -55 -100" fill="none" stroke="#0e1219" stroke-width="3"/>
      <path d="M 55 -135 Q 70 -118 55 -100" fill="none" stroke="#0e1219" stroke-width="3"/>
      <rect x="-55" y="-110" width="110" height="6" fill="#ff5a1f"/>
      <rect x="-40" y="-95" width="80" height="20" fill="#f7f5f0"/>
      <text x="0" y="-80" font-family="Arial" font-size="11" font-weight="800" fill="#1a1f29" text-anchor="middle">CHEM</text>
    </g>
    <g transform="translate(80,0)">
      <ellipse cx="0" cy="0" rx="55" ry="13" fill="#0d1119"/>
      <rect x="-55" y="-170" width="110" height="170" fill="#ff5a1f"/>
      <ellipse cx="0" cy="-170" rx="55" ry="13" fill="#bd4015"/>
      <ellipse cx="0" cy="-170" rx="45" ry="10" fill="#1a1f29"/>
      <path d="M -55 -135 Q -70 -118 -55 -100" fill="none" stroke="#bd4015" stroke-width="3"/>
      <path d="M 55 -135 Q 70 -118 55 -100" fill="none" stroke="#bd4015" stroke-width="3"/>
      <rect x="-40" y="-100" width="80" height="22" fill="#1a1f29"/>
      <text x="0" y="-83" font-family="Arial" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">CHEM-50</text>
    </g>
  </g>

</svg>
