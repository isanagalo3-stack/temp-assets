<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-print" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efece5"/>
      <stop offset="100%" stop-color="#e2ddcd"/>
    </linearGradient>
    <pattern id="grid-print" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f29" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <linearGradient id="metal-print" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a3142"/>
      <stop offset="50%" stop-color="#1a1f29"/>
      <stop offset="100%" stop-color="#0e1219"/>
    </linearGradient>
    <linearGradient id="metal2-print" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a4253"/>
      <stop offset="50%" stop-color="#252b39"/>
      <stop offset="100%" stop-color="#161a25"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg-print)"/>
  <rect width="800" height="800" fill="url(#grid-print)"/>
  <!-- Top-right ornament -->
  <circle cx="700" cy="120" r="80" fill="none" stroke="#1a1f29" stroke-width="1" opacity="0.07"/>
  <circle cx="700" cy="120" r="50" fill="none" stroke="#1a1f29" stroke-width="1" opacity="0.10"/>
  <circle cx="700" cy="120" r="20" fill="#ff5a1f" opacity="0.18"/>
  <!-- Top-left industry icon -->
  <g transform="translate(80,90)" opacity="0.5">
    
    <rect x="-15" y="-12" width="30" height="24" fill="none" stroke="#1a1f29" stroke-width="2"/>
    <line x1="-9" y1="-5" x2="9" y2="-5" stroke="#1a1f29" stroke-width="1.5"/>
    <line x1="-9" y1="0" x2="9" y2="0" stroke="#1a1f29" stroke-width="1.5"/>
    <line x1="-9" y1="5" x2="6" y2="5" stroke="#1a1f29" stroke-width="1.5"/>
  </g>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="650" rx="240" ry="14" fill="#1a1f29" opacity="0.10"/>

  <!-- Stacks of bound books / paper reams -->
  <!-- Bottom row: 3 wide reams -->
  <g transform="translate(400,640)">
    <g transform="translate(-180,0)">
      <!-- Stack of paper reams -->
      <path d="M -75 0 L 75 0 L 90 -8 L 90 -25 L -60 -25 L -75 -17 Z" fill="#f7f5f0" stroke="#1a1f29" stroke-width="1"/>
      <path d="M -75 -17 L 75 -17 L 90 -25 L -60 -25 Z" fill="#e3dfd1"/>
      <path d="M -75 -25 L 75 -25 L 90 -33 L 90 -50 L -60 -50 L -75 -42 Z" fill="#f7f5f0" stroke="#1a1f29" stroke-width="1"/>
      <path d="M -75 -42 L 75 -42 L 90 -50 L -60 -50 Z" fill="#e3dfd1"/>
      <path d="M -75 -50 L 75 -50 L 90 -58 L 90 -75 L -60 -75 L -75 -67 Z" fill="#f7f5f0" stroke="#1a1f29" stroke-width="1"/>
      <path d="M -75 -67 L 75 -67 L 90 -75 L -60 -75 Z" fill="#e3dfd1"/>
      <!-- side fine paper lines -->
      <line x1="-75" y1="-5" x2="75" y2="-5" stroke="#cfc9b6" stroke-width="0.5"/>
      <line x1="-75" y1="-9" x2="75" y2="-9" stroke="#cfc9b6" stroke-width="0.5"/>
      <line x1="-75" y1="-13" x2="75" y2="-13" stroke="#cfc9b6" stroke-width="0.5"/>
      <line x1="-75" y1="-30" x2="75" y2="-30" stroke="#cfc9b6" stroke-width="0.5"/>
      <line x1="-75" y1="-34" x2="75" y2="-34" stroke="#cfc9b6" stroke-width="0.5"/>
      <line x1="-75" y1="-38" x2="75" y2="-38" stroke="#cfc9b6" stroke-width="0.5"/>
      <line x1="-75" y1="-55" x2="75" y2="-55" stroke="#cfc9b6" stroke-width="0.5"/>
      <line x1="-75" y1="-59" x2="75" y2="-59" stroke="#cfc9b6" stroke-width="0.5"/>
      <line x1="-75" y1="-63" x2="75" y2="-63" stroke="#cfc9b6" stroke-width="0.5"/>
      <!-- band -->
      <rect x="-30" y="-85" width="60" height="90" fill="#ff5a1f" opacity="0.85"/>
    </g>
    <g transform="translate(0,0)">
      <!-- Bound book (taller) -->
      <path d="M -65 0 L 65 0 L 80 -10 L 80 -180 L -50 -180 L -65 -170 Z" fill="#1a1f29"/>
      <path d="M -65 0 L 65 0 L 80 -10 L -50 -10 Z" fill="#0e1219"/>
      <path d="M 65 0 L 65 -180 L 80 -180 L 80 -10 Z" fill="#0e1219"/>
      <!-- pages on right side -->
      <line x1="80" y1="-30" x2="80" y2="-160" stroke="#f7f5f0" stroke-width="2"/>
      <line x1="78" y1="-30" x2="78" y2="-160" stroke="#cfc9b6" stroke-width="0.5"/>
      <line x1="76" y1="-30" x2="76" y2="-160" stroke="#cfc9b6" stroke-width="0.5"/>
      <!-- spine label -->
      <rect x="-50" y="-150" width="110" height="40" fill="#ff5a1f"/>
      <text x="5" y="-122" font-family="Arial" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">PRINT</text>
      <text x="5" y="-92" font-family="Arial" font-size="10" font-weight="500" fill="#f7f5f0" text-anchor="middle">VOL. 01</text>
      <text x="5" y="-50" font-family="Arial" font-size="10" font-weight="500" fill="#f7f5f0" text-anchor="middle" opacity="0.7">2026</text>
    </g>
    <g transform="translate(180,0)">
      <path d="M -75 0 L 75 0 L 90 -8 L 90 -25 L -60 -25 L -75 -17 Z" fill="#1a1f29"/>
      <path d="M -75 -17 L 75 -17 L 90 -25 L -60 -25 Z" fill="#0e1219"/>
      <path d="M -75 -25 L 75 -25 L 90 -33 L 90 -50 L -60 -50 L -75 -42 Z" fill="#f7f5f0"/>
      <path d="M -75 -42 L 75 -42 L 90 -50 L -60 -50 Z" fill="#e3dfd1"/>
      <path d="M -75 -50 L 75 -50 L 90 -58 L 90 -75 L -60 -75 L -75 -67 Z" fill="#1a1f29"/>
      <path d="M -75 -67 L 75 -67 L 90 -75 L -60 -75 Z" fill="#0e1219"/>
      <line x1="-75" y1="-30" x2="75" y2="-30" stroke="#cfc9b6" stroke-width="0.5"/>
      <line x1="-75" y1="-34" x2="75" y2="-34" stroke="#cfc9b6" stroke-width="0.5"/>
      <line x1="-75" y1="-38" x2="75" y2="-38" stroke="#cfc9b6" stroke-width="0.5"/>
      <rect x="-30" y="-85" width="60" height="90" fill="#1a1f29" opacity="0.6"/>
      <rect x="-25" y="-80" width="50" height="80" fill="#ff5a1f" opacity="0.85"/>
    </g>
  </g>

  <!-- Top stack -->
  <g transform="translate(400,460)">
    <path d="M -85 0 L 85 0 L 100 -10 L 100 -28 L -70 -28 L -85 -18 Z" fill="#f7f5f0" stroke="#1a1f29" stroke-width="1"/>
    <path d="M -85 -18 L 85 -18 L 100 -28 L -70 -28 Z" fill="#e3dfd1"/>
    <line x1="-85" y1="-6" x2="85" y2="-6" stroke="#cfc9b6" stroke-width="0.5"/>
    <line x1="-85" y1="-10" x2="85" y2="-10" stroke="#cfc9b6" stroke-width="0.5"/>
    <line x1="-85" y1="-14" x2="85" y2="-14" stroke="#cfc9b6" stroke-width="0.5"/>
    <path d="M -85 -28 L 85 -28 L 100 -38 L 100 -56 L -70 -56 L -85 -46 Z" fill="#f7f5f0" stroke="#1a1f29" stroke-width="1"/>
    <path d="M -85 -46 L 85 -46 L 100 -56 L -70 -56 Z" fill="#e3dfd1"/>
    <line x1="-85" y1="-34" x2="85" y2="-34" stroke="#cfc9b6" stroke-width="0.5"/>
    <line x1="-85" y1="-38" x2="85" y2="-38" stroke="#cfc9b6" stroke-width="0.5"/>
    <line x1="-85" y1="-42" x2="85" y2="-42" stroke="#cfc9b6" stroke-width="0.5"/>
    <rect x="-35" y="-66" width="70" height="65" fill="#ff5a1f" opacity="0.85"/>
  </g>

  <!-- Lifted ream -->
  <g transform="translate(400,330)">
    <ellipse cx="0" cy="6" rx="60" ry="5" fill="#1a1f29" opacity="0.15"/>
    <path d="M -65 0 L 65 0 L 78 -8 L 78 -22 L -52 -22 L -65 -14 Z" fill="#1a1f29"/>
    <path d="M -65 -14 L 65 -14 L 78 -22 L -52 -22 Z" fill="#0e1219"/>
    <line x1="-65" y1="-4" x2="65" y2="-4" stroke="#252b39" stroke-width="0.5"/>
    <line x1="-65" y1="-8" x2="65" y2="-8" stroke="#252b39" stroke-width="0.5"/>
    <rect x="-22" y="-50" width="45" height="55" fill="#ff5a1f"/>
    <line x1="0" y1="-22" x2="0" y2="-70" stroke="#1a1f29" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.5"/>
    <rect x="-18" y="-75" width="36" height="6" rx="1" fill="#1a1f29" opacity="0.6"/>
  </g>

</svg>
