<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efece5"/>
      <stop offset="100%" stop-color="#e2ddcd"/>
    </linearGradient>
    <pattern id="grid-wood" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f29" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <linearGradient id="metal-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a3142"/>
      <stop offset="50%" stop-color="#1a1f29"/>
      <stop offset="100%" stop-color="#0e1219"/>
    </linearGradient>
    <linearGradient id="metal2-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a4253"/>
      <stop offset="50%" stop-color="#252b39"/>
      <stop offset="100%" stop-color="#161a25"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg-wood)"/>
  <rect width="800" height="800" fill="url(#grid-wood)"/>
  <!-- Top-right ornament -->
  <circle cx="700" cy="120" r="80" fill="none" stroke="#1a1f29" stroke-width="1" opacity="0.07"/>
  <circle cx="700" cy="120" r="50" fill="none" stroke="#1a1f29" stroke-width="1" opacity="0.10"/>
  <circle cx="700" cy="120" r="20" fill="#ff5a1f" opacity="0.18"/>
  <!-- Top-left industry icon -->
  <g transform="translate(80,90)" opacity="0.5">
    
    <rect x="-15" y="-12" width="30" height="6" fill="#1a1f29"/>
    <rect x="-15" y="-3" width="30" height="6" fill="#1a1f29" opacity="0.7"/>
    <rect x="-15" y="6" width="30" height="6" fill="#1a1f29" opacity="0.5"/>
  </g>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="650" rx="240" ry="14" fill="#1a1f29" opacity="0.10"/>

  <!-- Stacked wooden planks -->
  <!-- Use a slight isometric perspective showing length and edge -->

  <!-- Strap holding planks -->
  <g>
    <!-- Bottom plank stack (3 layers visible from end) -->
    <g transform="translate(400,640)">
      <!-- Plank layer 1 (bottom) -->
      <path d="M -240 0 L 240 0 L 260 -12 L 260 -32 L -220 -32 L -240 -20 Z" fill="#a89878"/>
      <path d="M -240 -20 L 240 -20 L 260 -32 L -220 -32 Z" fill="#bfa988"/>
      <path d="M 240 0 L 240 -20 L 260 -32 L 260 -12 Z" fill="#8a7860"/>
      <!-- wood grain -->
      <line x1="-240" y1="-7" x2="240" y2="-7" stroke="#8a7860" stroke-width="0.7" opacity="0.5"/>
      <line x1="-240" y1="-13" x2="240" y2="-13" stroke="#8a7860" stroke-width="0.7" opacity="0.5"/>
      <!-- Plank layer 2 -->
      <path d="M -240 -32 L 240 -32 L 260 -44 L 260 -64 L -220 -64 L -240 -52 Z" fill="#9a8868"/>
      <path d="M -240 -52 L 240 -52 L 260 -64 L -220 -64 Z" fill="#b09878"/>
      <path d="M 240 -32 L 240 -52 L 260 -64 L 260 -44 Z" fill="#7a6850"/>
      <line x1="-240" y1="-39" x2="240" y2="-39" stroke="#7a6850" stroke-width="0.7" opacity="0.5"/>
      <line x1="-240" y1="-45" x2="240" y2="-45" stroke="#7a6850" stroke-width="0.7" opacity="0.5"/>
      <!-- Plank layer 3 -->
      <path d="M -240 -64 L 240 -64 L 260 -76 L 260 -96 L -220 -96 L -240 -84 Z" fill="#a89878"/>
      <path d="M -240 -84 L 240 -84 L 260 -96 L -220 -96 Z" fill="#bfa988"/>
      <path d="M 240 -64 L 240 -84 L 260 -96 L 260 -76 Z" fill="#8a7860"/>
      <line x1="-240" y1="-71" x2="240" y2="-71" stroke="#8a7860" stroke-width="0.7" opacity="0.5"/>
      <line x1="-240" y1="-77" x2="240" y2="-77" stroke="#8a7860" stroke-width="0.7" opacity="0.5"/>
      <!-- Plank layer 4 -->
      <path d="M -240 -96 L 240 -96 L 260 -108 L 260 -128 L -220 -128 L -240 -116 Z" fill="#9a8868"/>
      <path d="M -240 -116 L 240 -116 L 260 -128 L -220 -128 Z" fill="#b09878"/>
      <path d="M 240 -96 L 240 -116 L 260 -128 L 260 -108 Z" fill="#7a6850"/>
      <line x1="-240" y1="-103" x2="240" y2="-103" stroke="#7a6850" stroke-width="0.7" opacity="0.5"/>
      <line x1="-240" y1="-109" x2="240" y2="-109" stroke="#7a6850" stroke-width="0.7" opacity="0.5"/>

      <!-- Strapping -->
      <rect x="-145" y="-128" width="14" height="128" fill="#1a1f29" opacity="0.85"/>
      <rect x="-145" y="-128" width="14" height="6" fill="#3a4253" opacity="0.85"/>
      <rect x="131" y="-128" width="14" height="128" fill="#1a1f29" opacity="0.85"/>
      <rect x="131" y="-128" width="14" height="6" fill="#3a4253" opacity="0.85"/>

      <!-- Strap label -->
      <rect x="-25" y="-128" width="50" height="22" fill="#ff5a1f"/>
    </g>

    <!-- Top second smaller stack -->
    <g transform="translate(400,490)">
      <path d="M -200 0 L 200 0 L 218 -10 L 218 -28 L -182 -28 L -200 -18 Z" fill="#a89878"/>
      <path d="M -200 -18 L 200 -18 L 218 -28 L -182 -28 Z" fill="#bfa988"/>
      <path d="M 200 0 L 200 -18 L 218 -28 L 218 -10 Z" fill="#8a7860"/>
      <line x1="-200" y1="-6" x2="200" y2="-6" stroke="#8a7860" stroke-width="0.6" opacity="0.5"/>
      <line x1="-200" y1="-12" x2="200" y2="-12" stroke="#8a7860" stroke-width="0.6" opacity="0.5"/>

      <path d="M -200 -28 L 200 -28 L 218 -38 L 218 -56 L -182 -56 L -200 -46 Z" fill="#9a8868"/>
      <path d="M -200 -46 L 200 -46 L 218 -56 L -182 -56 Z" fill="#b09878"/>
      <path d="M 200 -28 L 200 -46 L 218 -56 L 218 -38 Z" fill="#7a6850"/>
      <line x1="-200" y1="-34" x2="200" y2="-34" stroke="#7a6850" stroke-width="0.6" opacity="0.5"/>
      <line x1="-200" y1="-40" x2="200" y2="-40" stroke="#7a6850" stroke-width="0.6" opacity="0.5"/>

      <path d="M -200 -56 L 200 -56 L 218 -66 L 218 -84 L -182 -84 L -200 -74 Z" fill="#a89878"/>
      <path d="M -200 -74 L 200 -74 L 218 -84 L -182 -84 Z" fill="#bfa988"/>
      <path d="M 200 -56 L 200 -74 L 218 -84 L 218 -66 Z" fill="#8a7860"/>
      <line x1="-200" y1="-62" x2="200" y2="-62" stroke="#8a7860" stroke-width="0.6" opacity="0.5"/>
      <line x1="-200" y1="-68" x2="200" y2="-68" stroke="#8a7860" stroke-width="0.6" opacity="0.5"/>

      <rect x="-115" y="-84" width="12" height="84" fill="#1a1f29" opacity="0.85"/>
      <rect x="103" y="-84" width="12" height="84" fill="#1a1f29" opacity="0.85"/>
    </g>

    <!-- Hovering plank with gripper -->
    <g transform="translate(400,360)">
      <ellipse cx="0" cy="6" rx="100" ry="5" fill="#1a1f29" opacity="0.15"/>
      <path d="M -130 0 L 130 0 L 145 -10 L 145 -22 L -115 -22 L -130 -12 Z" fill="#9a8868"/>
      <path d="M -130 -12 L 130 -12 L 145 -22 L -115 -22 Z" fill="#b09878"/>
      <path d="M 130 0 L 130 -12 L 145 -22 L 145 -10 Z" fill="#7a6850"/>
      <line x1="-130" y1="-5" x2="130" y2="-5" stroke="#7a6850" stroke-width="0.6"/>
      <line x1="-130" y1="-8" x2="130" y2="-8" stroke="#7a6850" stroke-width="0.6"/>

      <line x1="-50" y1="-22" x2="-50" y2="-65" stroke="#1a1f29" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.5"/>
      <line x1="50" y1="-22" x2="50" y2="-65" stroke="#1a1f29" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.5"/>
      <rect x="-65" y="-70" width="130" height="6" rx="1" fill="#1a1f29" opacity="0.6"/>
    </g>
  </g>

</svg>
