<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-c3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efece5"/>
      <stop offset="100%" stop-color="#e2ddcd"/>
    </linearGradient>
    <pattern id="grid-c3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f29" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <linearGradient id="metal-c3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a3142"/>
      <stop offset="50%" stop-color="#1a1f29"/>
      <stop offset="100%" stop-color="#0e1219"/>
    </linearGradient>
    <linearGradient id="metal2-c3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a4253"/>
      <stop offset="50%" stop-color="#252b39"/>
      <stop offset="100%" stop-color="#161a25"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg-c3)"/>
  <rect width="800" height="800" fill="url(#grid-c3)"/>
  <!-- Top-right ornament -->
  <circle cx="700" cy="120" r="80" fill="none" stroke="#1a1f29" stroke-width="1" opacity="0.07"/>
  <circle cx="700" cy="120" r="50" fill="none" stroke="#1a1f29" stroke-width="1" opacity="0.10"/>
  <circle cx="700" cy="120" r="20" fill="#ff5a1f" opacity="0.18"/>
  <!-- Top-left industry icon -->
  <g transform="translate(80,90)" opacity="0.5">
    
    <rect x="-15" y="-12" width="30" height="20" fill="none" stroke="#1a1f29" stroke-width="2" rx="2"/>
    <rect x="-3" y="8" width="6" height="6" fill="#1a1f29"/>
    <line x1="-12" y1="-6" x2="12" y2="-6" stroke="#1a1f29" stroke-width="1.5"/>
  </g>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="650" rx="240" ry="14" fill="#1a1f29" opacity="0.10"/>

  <!-- Sleek black tech boxes -->
  <!-- Bottom row: 3 wide boxes -->
  <g transform="translate(400,640)">
    <g transform="translate(-160,0)">
      <path d="M -75 0 L 75 0 L 75 -120 L -75 -120 Z" fill="#1a1f29"/>
      <path d="M -75 0 L 75 0 L 90 -12 L 90 -132 L -60 -132 L -75 -120 Z" fill="#252b39"/>
      <path d="M 75 0 L 75 -120 L 90 -132 L 90 -12 Z" fill="#0e1219"/>
      <rect x="-60" y="-105" width="80" height="3" fill="#ff5a1f"/>
      <rect x="-60" y="-95" width="50" height="3" fill="#f7f5f0" opacity="0.7"/>
      <rect x="-60" y="-85" width="40" height="2" fill="#f7f5f0" opacity="0.5"/>
      <circle cx="50" cy="-30" r="4" fill="#ff5a1f"/>
    </g>
    <g transform="translate(0,0)">
      <path d="M -75 0 L 75 0 L 75 -120 L -75 -120 Z" fill="#f7f5f0"/>
      <path d="M -75 0 L 75 0 L 90 -12 L 90 -132 L -60 -132 L -75 -120 Z" fill="#e3dfd1"/>
      <path d="M 75 0 L 75 -120 L 90 -132 L 90 -12 Z" fill="#cfc9b6"/>
      <rect x="-60" y="-105" width="80" height="3" fill="#1a1f29"/>
      <rect x="-60" y="-95" width="50" height="3" fill="#1a1f29" opacity="0.6"/>
      <rect x="-60" y="-85" width="40" height="2" fill="#1a1f29" opacity="0.4"/>
      <circle cx="50" cy="-30" r="4" fill="#ff5a1f"/>
    </g>
    <g transform="translate(160,0)">
      <path d="M -75 0 L 75 0 L 75 -120 L -75 -120 Z" fill="#1a1f29"/>
      <path d="M -75 0 L 75 0 L 90 -12 L 90 -132 L -60 -132 L -75 -120 Z" fill="#252b39"/>
      <path d="M 75 0 L 75 -120 L 90 -132 L 90 -12 Z" fill="#0e1219"/>
      <rect x="-60" y="-105" width="80" height="3" fill="#ff5a1f"/>
      <rect x="-60" y="-95" width="50" height="3" fill="#f7f5f0" opacity="0.7"/>
      <rect x="-60" y="-85" width="40" height="2" fill="#f7f5f0" opacity="0.5"/>
      <circle cx="50" cy="-30" r="4" fill="#ff5a1f"/>
    </g>
  </g>

  <!-- Middle row: 2 boxes -->
  <g transform="translate(400,510)">
    <g transform="translate(-90,0)">
      <path d="M -70 0 L 70 0 L 70 -110 L -70 -110 Z" fill="#1a1f29"/>
      <path d="M -70 0 L 70 0 L 84 -12 L 84 -122 L -56 -122 L -70 -110 Z" fill="#252b39"/>
      <path d="M 70 0 L 70 -110 L 84 -122 L 84 -12 Z" fill="#0e1219"/>
      <rect x="-55" y="-95" width="80" height="3" fill="#f7f5f0" opacity="0.8"/>
      <rect x="-55" y="-85" width="50" height="2" fill="#f7f5f0" opacity="0.5"/>
      <circle cx="50" cy="-25" r="4" fill="#ff5a1f"/>
    </g>
    <g transform="translate(90,0)">
      <path d="M -70 0 L 70 0 L 70 -110 L -70 -110 Z" fill="#ff5a1f"/>
      <path d="M -70 0 L 70 0 L 84 -12 L 84 -122 L -56 -122 L -70 -110 Z" fill="#e8511c"/>
      <path d="M 70 0 L 70 -110 L 84 -122 L 84 -12 Z" fill="#bd4015"/>
      <rect x="-55" y="-95" width="80" height="3" fill="#fff" opacity="0.9"/>
      <rect x="-55" y="-85" width="50" height="2" fill="#fff" opacity="0.6"/>
      <circle cx="50" cy="-25" r="4" fill="#1a1f29"/>
    </g>
  </g>

  <!-- Top: single premium box -->
  <g transform="translate(400,395)">
    <path d="M -68 0 L 68 0 L 68 -100 L -68 -100 Z" fill="#1a1f29"/>
    <path d="M -68 0 L 68 0 L 82 -12 L 82 -112 L -54 -112 L -68 -100 Z" fill="#252b39"/>
    <path d="M 68 0 L 68 -100 L 82 -112 L 82 -12 Z" fill="#0e1219"/>
    <!-- Premium logo -->
    <circle cx="0" cy="-60" r="14" fill="none" stroke="#ff5a1f" stroke-width="2.5"/>
    <line x1="-7" y1="-60" x2="7" y2="-60" stroke="#ff5a1f" stroke-width="2.5"/>
    <line x1="0" y1="-67" x2="0" y2="-53" stroke="#ff5a1f" stroke-width="2.5"/>
    <circle cx="60" cy="-22" r="4" fill="#ff5a1f"/>
  </g>

  <!-- Hovering box with gripper -->
  <g transform="translate(400,290)">
    <ellipse cx="0" cy="6" rx="50" ry="5" fill="#1a1f29" opacity="0.15"/>
    <path d="M -55 0 L 55 0 L 55 -85 L -55 -85 Z" fill="#1a1f29"/>
    <path d="M -55 0 L 55 0 L 67 -10 L 67 -95 L -43 -95 L -55 -85 Z" fill="#252b39"/>
    <path d="M 55 0 L 55 -85 L 67 -95 L 67 -10 Z" fill="#0e1219"/>
    <rect x="-40" y="-70" width="55" height="3" fill="#ff5a1f"/>
    <rect x="-40" y="-60" width="35" height="2" fill="#f7f5f0" opacity="0.7"/>
    <line x1="0" y1="-85" x2="0" y2="-130" stroke="#1a1f29" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.5"/>
    <rect x="-18" y="-135" width="36" height="6" rx="1" fill="#1a1f29" opacity="0.6"/>
  </g>

  <!-- Subtle circuit pattern decoration -->
  <g opacity="0.08" stroke="#1a1f29" stroke-width="1" fill="none">
    <path d="M 100 720 L 200 720 L 200 700 L 250 700"/>
    <circle cx="100" cy="720" r="3" fill="#1a1f29"/>
    <circle cx="250" cy="700" r="3" fill="#1a1f29"/>
    <path d="M 600 720 L 700 720 L 700 700"/>
    <circle cx="700" cy="700" r="3" fill="#1a1f29"/>
  </g>

</svg>
