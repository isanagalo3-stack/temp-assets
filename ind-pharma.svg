    <ellipse cx="0" cy="6" rx="50" ry="5" fill="#1a1f29" opacity="0.15"/>
    <path d="M -45 0 L 45 0 L 45 -80 L -45 -80 Z" fill="#ff5a1f"/>
    <path d="M -45 0 L 45 0 L 56 -8 L 56 -88 L -34 -88 L -45 -80 Z" fill="#e8511c"/>
    <path d="M 45 0 L 45 -80 L 56 -8 L 56 -88 Z" fill="#bd4015"/>
    <rect x="-45" y="-65" width="90" height="9" fill="#f7f5f0"/>
    <rect x="-10" y="-43" width="20" height="4" fill="#fff"/>
    <rect x="-2" y="-51" width="4" height="20" fill="#fff"/>
    <line x1="0" y1="-80" x2="0" y2="-130" stroke="#1a1f29" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.5"/>
    <rect x="-18" y="-135" width="36" height="6" rx="1" fill="#1a1f29" opacity="0.6"/>
  </g>

</svg>
