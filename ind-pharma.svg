      <path d="M -55 0 L 55 0 L 70 -10 L 70 -120 L -40 -120 L -55 -110 Z" fill="#e3dfd1"/>
      <path d="M 55 0 L 55 -110 L 70 -120 L 70 -10 Z" fill="#cfc9b6"/>
      <rect x="-55" y="-90" width="110" height="14" fill="#ff5a1f"/>
      <rect x="-50" y="-65" width="50" height="3" fill="#1a1f29" opacity="0.4"/>
      <rect x="-50" y="-55" width="40" height="3" fill="#1a1f29" opacity="0.3"/>
      <text x="0" y="-30" font-family="Arial" font-size="11" font-weight="700" fill="#1a1f29" text-anchor="middle">RX</text>
    </g>
    <g transform="translate(-60,0)">
      <path d="M -55 0 L 55 0 L 55 -110 L -55 -110 Z" fill="#1a1f29"/>
      <path d="M -55 0 L 55 0 L 70 -10 L 70 -120 L -40 -120 L -55 -110 Z" fill="#252b39"/>
      <path d="M 55 0 L 55 -110 L 70 -120 L 70 -10 Z" fill="#0e1219"/>
      <rect x="-55" y="-90" width="110" height="14" fill="#f7f5f0"/>
      <rect x="-15" y="-65" width="30" height="6" fill="#ff5a1f"/>
      <rect x="-3" y="-77" width="6" height="30" fill="#ff5a1f"/>
