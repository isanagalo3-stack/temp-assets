      <path d="M -52 0 L 52 0 L 65 -10 L 65 -110 L -39 -110 L -52 -100 Z" fill="#e8511c"/>
      <path d="M 52 0 L 52 -100 L 65 -110 L 65 -10 Z" fill="#bd4015"/>
      <rect x="-52" y="-82" width="104" height="12" fill="#f7f5f0"/>
      <rect x="-15" y="-55" width="30" height="6" fill="#fff"/>
      <rect x="-3" y="-67" width="6" height="30" fill="#fff"/>
    </g>
    <g transform="translate(115,0)">
      <path d="M -52 0 L 52 0 L 52 -100 L -52 -100 Z" fill="#f7f5f0"/>
      <path d="M -52 0 L 52 0 L 65 -10 L 65 -110 L -39 -110 L -52 -100 Z" fill="#e3dfd1"/>
      <path d="M 52 0 L 52 -100 L 65 -110 L 65 -10 Z" fill="#cfc9b6"/>
