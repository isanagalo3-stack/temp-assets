      <path d="M -50 0 L 50 0 L 62 -10 L 62 -100 L -38 -100 L -50 -90 Z" fill="#252b39"/>
      <path d="M 50 0 L 50 -90 L 62 -100 L 62 -10 Z" fill="#0e1219"/>
      <rect x="-50" y="-72" width="100" height="11" fill="#ff5a1f"/>
      <rect x="-12" y="-50" width="24" height="5" fill="#fff"/>
      <rect x="-2.5" y="-60" width="5" height="24" fill="#fff"/>
    </g>
    <g transform="translate(55,0)">
      <path d="M -50 0 L 50 0 L 50 -90 L -50 -90 Z" fill="#f7f5f0"/>
      <path d="M -50 0 L 50 0 L 62 -10 L 62 -100 L -38 -100 L -50 -90 Z" fill="#e3dfd1"/>
      <path d="M 50 0 L 50 -90 L 62 -100 L 62 -10 Z" fill="#cfc9b6"/>
      <rect x="-50" y="-72" width="100" height="11" fill="#1a1f29"/>
      <rect x="-12" y="-50" width="24" height="5" fill="#ff5a1f"/>
